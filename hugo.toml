baseURL = 'https://ai-tool-review.pages.dev/'
locale = 'en-us'
title = 'AI Tool Radar - Honest Reviews & Comparisons'
theme = 'PaperMod'

[params]
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowWordCount = true
  ShowFullTextinRSS = true
  showDescriptionInList = true
  description = "Independent AI tool reviews for developers, indie builders, and small technical teams. Verified pricing, honest limitations, no fabricated testing."
  author = 'AI Tool Radar Team'

  [params.verify]
    google = '9HkhOK3lCop1FhvC4vw9BLWEFlvsA2fX9VsxgW8rQKs'
  keywords = ['AI tools', 'AI reviews', 'AI comparisons', 'AI tools for developers', 'AI coding assistants']

  [params.homeInfoParams]
    Title = 'AI Tool Radar'
    Content = 'Independent AI tool reviews for developers, indie builders, and small technical teams. We focus on verified pricing, workflow fit, honest limitations, and ecosystem maturity — not marketing copy.'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:lidonson666@gmail.com'

[params.assets]
  favicon = '/favicon.ico'

[outputs]
  home = ['HTML', 'RSS']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'dracula'
    lineNos = false

[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 10
[[menu.main]]
  identifier = 'editorial-policy'
  name = 'Editorial Policy'
  url = '/editorial-policy/'
  weight = 20
[[menu.main]]
  identifier = 'contact'
  name = 'Contact'
  url = '/contact/'
  weight = 30
[[menu.main]]
  identifier = 'privacy'
  name = 'Privacy'
  url = '/privacy-policy/'
  weight = 40
[[menu.main]]
  identifier = 'terms'
  name = 'Terms'
  url = '/terms-of-service/'
  weight = 50

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[pagination]
pagerSize = 1000
